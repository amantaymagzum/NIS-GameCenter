<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title"><title id="title">Имя помогает понять действие</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5d956c"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#c5d3c0"/></pattern></defs><rect width="960" height="400" rx="18" fill="#edf3e7"/><rect width="960" height="400" rx="18" fill="url(#dots)" opacity=".4"/><g font-family="Segoe UI, Arial, sans-serif"><text x="34" y="41" font-size="21" fill="#283b33" font-weight="650" text-anchor="start">УРОК 06 / Имя помогает понять действие</text><rect x="34" y="84" width="244" height="244" rx="14" fill="#ffffff" stroke="#cad8c4" stroke-width="2"/><text x="55" y="122" font-size="18" fill="#5d956c" font-weight="650" text-anchor="start">НАСТРОЙКИ</text><rect x="54" y="145" width="149" height="34" rx="8" fill="#e4ecd9" stroke="none" stroke-width="2"/><text x="68" y="168" font-size="17" fill="#283b33" font-weight="500" text-anchor="start">speed = 230</text><rect x="54" y="198" width="204" height="34" rx="8" fill="#e4ecd9" stroke="none" stroke-width="2"/><text x="68" y="221" font-size="17" fill="#283b33" font-weight="500" text-anchor="start">jumpSpeed = −480</text><text x="55" y="295" font-size="18" fill="#64766a" font-weight="500" text-anchor="start">Хранят значения</text><path d="M291 205 L338 205" stroke="#5d956c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="354" y="84" width="290" height="244" rx="14" fill="#263b32" stroke="none" stroke-width="2"/><text x="378" y="130" font-size="30" fill="#ffffff" font-weight="650" text-anchor="start">respawn()</text><text x="378" y="179" font-size="21" fill="#bfdc9d" font-weight="500" text-anchor="start">1. Вернуть X</text><text x="378" y="221" font-size="21" fill="#bfdc9d" font-weight="500" text-anchor="start">2. Вернуть Y</text><text x="378" y="263" font-size="19" fill="#bfdc9d" font-weight="500" text-anchor="start">3. Обнулить скорость</text><path d="M658 205 L703 205" stroke="#5d956c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="719" y="84" width="207" height="244" rx="14" fill="#ffffff" stroke="#cad8c4" stroke-width="2"/><text x="739" y="122" font-size="16" fill="#5d956c" font-weight="650" text-anchor="start">СНОВА НА СТАРТЕ</text><g transform="translate(824 233) scale(1.25)" opacity="1"><rect x="-15" y="-22" width="30" height="38" rx="6" fill="#edaa76"/><rect x="-12" y="-36" width="24" height="22" rx="5" fill="#f4c394"/><rect x="-6" y="-28" width="4" height="5" fill="#283b33"/><rect x="4" y="-28" width="4" height="5" fill="#283b33"/><rect x="-12" y="14" width="8" height="10" rx="2" fill="#815e4d"/><rect x="4" y="14" width="8" height="10" rx="2" fill="#815e4d"/></g><rect x="751" y="264" width="144" height="21" rx="4" fill="#83aa8d" stroke="none" stroke-width="2"/><rect x="751" y="264" width="144" height="6" rx="2" fill="#bfdc9d" stroke="none" stroke-width="2"/><text x="739" y="306" font-size="18" fill="#64766a" font-weight="500" text-anchor="start">R или падение</text><text x="34" y="370" font-size="17" fill="#64766a" font-weight="500" text-anchor="start">this.respawn — обращение к методу. this.respawn() — вызов: действие выполнится.</text></g></svg>