<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title"><title id="title">Картинка ≠ движение ≠ столкновение</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5d956c"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#c5d3c0"/></pattern></defs><rect width="960" height="400" rx="18" fill="#edf3e7"/><rect width="960" height="400" rx="18" fill="url(#dots)" opacity=".4"/><g font-family="Segoe UI, Arial, sans-serif"><text x="34" y="41" font-size="21" fill="#283b33" font-weight="650" text-anchor="start">УРОК 02 / Картинка ≠ движение ≠ столкновение</text><rect x="33" y="82" width="278" height="252" rx="14" fill="#ffffff" stroke="#cad8c4" stroke-width="2"/><text x="55" y="119" font-size="23" fill="#283b33" font-weight="650" text-anchor="start">Sprite Renderer</text><g transform="translate(168 220) scale(1.5)" opacity="1"><rect x="-15" y="-22" width="30" height="38" rx="6" fill="#edaa76"/><rect x="-12" y="-36" width="24" height="22" rx="5" fill="#f4c394"/><rect x="-6" y="-28" width="4" height="5" fill="#283b33"/><rect x="4" y="-28" width="4" height="5" fill="#283b33"/><rect x="-12" y="14" width="8" height="10" rx="2" fill="#815e4d"/><rect x="4" y="14" width="8" height="10" rx="2" fill="#815e4d"/></g><text x="55" y="303" font-size="19" fill="#64766a" font-weight="500" text-anchor="start">Рисует персонажа</text><rect x="341" y="82" width="278" height="252" rx="14" fill="#ffffff" stroke="#cad8c4" stroke-width="2"/><text x="363" y="119" font-size="23" fill="#283b33" font-weight="650" text-anchor="start">Rigidbody 2D</text><g transform="translate(450 200) scale(1.1)" opacity="1"><rect x="-15" y="-22" width="30" height="38" rx="6" fill="#edaa76"/><rect x="-12" y="-36" width="24" height="22" rx="5" fill="#f4c394"/><rect x="-6" y="-28" width