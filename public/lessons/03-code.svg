30</text><text x="367" y="237" font-size="20" fill="#bfdc9d" font-weight="500" text-anchor="start">скорость X</text><path d="M646 199 L699 199" stroke="#5d956c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="717" y="98" width="207" height="202" rx="14" fill="#ffffff" stroke="#cad8c4" stroke-width="2"/><text x="737" y="137" font-size="18" fill="#5d956c" font-weight="650" text-anchor="start">РЕЗУЛЬТАТ</text><g transform="translate(786 230) scale(1.2)" opacity="1"><rect x="-15" y="-22" width="30" height="38" rx="6" fill="#edaa76"/><rect x="-12" y="-36" width="24" height="22" rx="5" fill="#f4c394"/><rect x="-6" y="-28" width="4" height="5" fill="#283b33"/><rect x="4" y="-28" width="4" height="5" fill="#283b33"/><rect x="-12" y="14" width="8" height="10" rx="2" fill="#815e4d"/><rect x="4" y="14" width="8" height="10" rx="2" fill="#815e4d"/></g><path d="M822 203 L889 203" stroke="#5d956c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="740" y="278" font-size="18" fill="#64766a" font-weight="500" text-anchor="start">230 пикселей/с</text><text x="34" y="370" font-size="17" fill="#64766a" font-weight="500" text-anchor="start">Ничего не нажато → direction = 0 → горизонтальная скорость = 0.</text></g></svg>