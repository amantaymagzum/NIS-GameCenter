<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title"><title id="title">Таймеры и испытание на время</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5d956c"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#c5d3c0"/></pattern></defs><rect width="960" height="400" rx="18" fill="#edf3e7"/><rect width="960" height="400" rx="18" fill="url(#dots)" opacity=".4"/><g font-family="Segoe UI, Arial, sans-serif"><text x="34" y="41" font-size="21" fill="#283b33" font-weight="650" text-anchor="start">УРОК 11 / Таймеры и испытание на время</text><rect x="35" y="105" width="280" height="160" rx="14" fill="#ffffff" stroke="#cad8c4" stroke-width="2"/><text x="55" y="145" font-size="24" fill="#5d956c" font-weight="650" text-anchor="start">1</text><text x="55" y="205" font-size="17" fill="#283b33" font-weight="600" text-anchor="start">Накопи секунды</text><rect x="340" y="105" width="280" height="160" rx="14" fill="#ffffff" stroke="#cad8c4" stroke-width="2"/><text x="360" y="145" font-size="24" fill="#5d956c" font-weight="650" text-anchor="start">2</text><text x="360" y="205" font-size="17" fill="#283b33" font-weight="600" text-anchor="start">Обнови текст</text><rect x="645" y="105" width="280" height="160" rx="14" fill="#ffffff" stroke="#cad8c4" stroke-width="2"/><text x="665" y="145" font-size="24" fill="#5d956c" font-weight="650" text-anchor="start">3</text><text x="665" y="205" font-size="17" fill="#283b33" font-weight="600" text-anchor="start">Проверь ноль</text><text x="34" y="370" font-size="17" fill="#64766a" font-weight="500" text-anchor="start">60 × 1/60 = 1 секунда игрового времени.</text></g></svg>