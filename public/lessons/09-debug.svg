<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title"><title id="title">Найти ошибку — это тоже навык</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5d956c"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#c5d3c0"/></pattern></defs><rect width="960" height="400" rx="18" fill="#edf3e7"/><rect width="960" height="400" rx="18" fill="url(#dots)" opacity=".4"/><g font-family="Segoe UI, Arial, sans-serif"><text x="34" y="41" font-size="21" fill="#283b33" font-weight="650" text-anchor="start">УРОК 09 / Найти ошибку — это тоже навык</text><rect x="34" y="85" width="260" height="243" rx="14" fill="#ffffff" stroke="#cad8c4" stroke-width="2"/><text x="55" y="126" font-size="19" fill="#5d956c" font-weight="650" text-anchor="start">1. ОЖИДАНИЕ</text><circle cx="89" cy="192" r="19" fill="#aa91d5"/><circle cx="89" cy="192" r="12.35" stroke="#f1e8ff" stroke-width="2" fill="none"/><text x="89" y="198" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><circle cx="161" cy="192" r="19" fill="#aa91d5"/><circle cx="161" cy="192" r="12.35" stroke="#f1e8ff" stroke-width="2" fill="none"/><text x="161" y="198" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><circle cx="233" cy="192" r="19" fill="#aa91d5"/><circle cx="233" cy="192" r="12.35" stroke="#f1e8ff" stroke-width="2" fill="none"/><text x="233" y="198" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="164" y="261" font-size="19" fill="#283b33" font-weight="600" text-anchor="middle">Победа при 3 очках</text><path d="M307 205 L342 205" stroke="#5d956c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="355" y="85" width="260" height="243" rx="14" fill="#263b32" stroke="none" stroke-width="2"/><text x="377" y="126" font-size="18" fill="#bfdc9d" font-weight="650" text-anchor="start">2. НАБЛЮДЕНИЕ</text><text x="379" y="188" font-size="24" fill="#ffffff" font-weight="650" text-anchor="start">Счёт: 0</text><text x="379" y="235" font-size="24" fill="#edaa76" font-weight="650" text-anchor="start">Победа?!</text><text x="379" y="299" font-size="18" fill="#bfdc9d" font-weight="500" text-anchor="start">Проверь условие</text><path d="M628 205 L664 205" stroke="#5d956c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="678" y="85" width="248" height="243" rx="14" fill="#ffffff" stroke="#cad8c4" stroke-width="2"/><text x="698" y="126" font-size="17" fill="#5d956c" font-weight="650" text-anchor="start">3. ИСПРАВЛЕНИЕ</text><text x="700" y="187" font-size="24" fill="#283b33" font-weight="650" text-anchor="start">score &gt;= 3</text><text x="700" y="237" font-size="20" fill="#5d956c" font-weight="650" text-anchor="start">Повтори тест</text><text x="700" y="299" font-size="18" fill="#64766a" font-weight="500" text-anchor="start">Результат совпал?</text><text x="34" y="370" font-size="17" fill="#64766a" font-weight="500" text-anchor="start">Меняй одну причину за раз. Проверяй не только успех, но и ранний финиш.</text></g></svg>