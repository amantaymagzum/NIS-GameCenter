<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title"><title id="title">Касание запускает правило</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5d956c"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#c5d3c0"/></pattern></defs><rect width="960" height="400" rx="18" fill="#edf3e7"/><rect width="960" height="400" rx="18" fill="url(#dots)" opacity=".4"/><g font-family="Segoe UI, Arial, sans-serif"><text x="34" y="41" font-size="21" fill="#283b33" font-weight="650" text-anchor="start">УРОК 04 / Касание запускает правило</text><rect x="33" y="87" width="266" height="242" rx="14" fill="#ffffff" stroke="#cad8c4" stroke-width="2"/><text x="55" y="126" font-size="19" fill="#5d956c" font-weight="650" text-anchor="start">1. КОСНИСЬ</text><g transform="translate(110 230) scale(1.2)" opacity="1"><rect x="-15" y="-22" width="30" height="38" rx="6" fill="#edaa76"/><rect x="-12" y="-36" width="24" height="22" rx="5" fill="#f4c394"/><rect x="-6" y="-28" width="4" height="5" fill="#283b33"/><rect x="4" y="-28" width="4" height="5" fill="#283b33"/><rect x="-12" y="14" width="8" height="10" rx="2" fill="#815e4d"/><rect x="4" y="14" width="8" height="10" rx="2" fill="#815e4d"/></g><circle cx="221" cy="207" r="23" fill="#aa91d5"/><circle cx="221" cy="207" r="14.950000000000001" stroke="#f1e8ff" stroke-width="2" fill="none"/><text x="221" y="213" font-size="23" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><circle cx="221" cy="207" r="47" stroke="#aa91d5" stroke-dasharray="6 5" stroke-width="2" fill="none"/><path d="M141 206 L171 206" stroke="#5d956c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="57" y="304" font-size="18" fill="#64766a" font-weight="500" text-anchor="start">Триггер не мешает идти</text><path d="M310 206 L349 206" stroke="#5d956c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="365" y="87" width="262" height="242" rx="14" fill="#263b32" stroke="none" stroke-width="2"/><text x="386" y="126" font-size="19" fill="#bfdc9d" font-weight="650" text-anchor="start">2. ПРОВЕРЬ ТЕГ</text><text x="387" y="189" font-size="24" fill="#ffffff" font-weight="650" text-anchor="start">other.tag</text><text x="387" y="233" font-size="24" fill="#d1b8f2" font-weight="650" text-anchor="start">=== &quot;Coin&quot;</text><text x="387" y="303" font-size="18" fill="#bfdc9d" font-weight="500" text-anchor="start">Удалить монетку</text><path d="M639 206 L676 206" stroke="#5d956c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="692" y="87" width="234" height="242" rx="14" fill="#ffffff" stroke="#cad8c4" stroke-width="2"/><text x="711" y="126" font-size="18" fill="#5d956c" font-weight="650" text-anchor="start">3. ПОЛУЧИ ОЧКИ</text><text x="808" y="225" font-size="43" fill="#283b33" font-weight="650" text-anchor="middle">0 → 1</text><text x="715" y="303" font-size="18" fill="#64766a" font-weight="500" text-anchor="start">Scene.score += 1</text><text x="34" y="370" font-size="17" fill="#64766a" font-weight="500" text-anchor="start">Тег написан с другой буквой? Coin и coin — разные строки.</text></g></svg>