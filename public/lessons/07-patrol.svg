<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title"><title id="title">Дойти до края и развернуться</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5d956c"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#c5d3c0"/></pattern></defs><rect width="960" height="400" rx="18" fill="#edf3e7"/><rect width="960" height="400" rx="18" fill="url(#dots)" opacity=".4"/><g font-family="Segoe UI, Arial, sans-serif"><text x="34" y="41" font-size="21" fill="#283b33" font-weight="650" text-anchor="start">УРОК 07 / Дойти до края и развернуться</text><rect x="48" y="86" width="138" height="34" rx="8" fill="#ffffff" stroke="none" stroke-width="2"/><text x="62" y="109" font-size="17" fill="#283b33" font-weight="500" text-anchor="start">left = 100</text><rect x="729" y="86" width="149" height="34" rx="8" fill="#ffffff" stroke="none" stroke-width="2"/><text x="743" y="109" font-size="17" fill="#283b33" font-weight="500" text-anchor="start">right = 300</text><path d="M150 152 L150 306" stroke="#5d956c" stroke-width="2" fill="none" stroke-dasharray="5 5"/><path d="M807 152 L807 306" stroke="#5d956c" stroke-width="2" fill="none" stroke-dasharray="5 5"/><rect x="111" y="283" width="735" height="21" rx="4" fill="#83aa8d" stroke="none" stroke-width="2"/><rect x="111" y="283" width="735" height="6" rx="2" fill="#bfdc9d" stroke="none" stroke-width="2"/><g transform="translate(173 255) scale(1)" opacity="0.3"><rect x="-15" y="-22" width="30" height="38" rx="6" fill="#edaa76"/><rect x="-12" y="-36" width="24" height="22" rx="5" fill="#f4c394"/><rect x="-6" y="-28" width="4" height="5" fill="#283b33"/><rect x="4" y="-28" width="4" height="5" fill="#283b33"/><rect x="-12" y="14" width="8" height="10" rx="2" fill="#815e4d"/><rect x="4" y="14" width="8" height="10" rx="2" fill="#815e4d"/></g><g transform="translate(478 255) scale(1.2)" opacity="1"><rect x="-15" y="-22" width="30" height="38" rx="6" fill="#edaa76"/><rect x="-12" y="-36" width="24" height="22" rx="5" fill="#f4c394"/><rect x="-6" y="-28" width="4" height="5" fill="#283b33"/><rect x="4" y="-28" width="4" height="5" fill="#283b33"/><rect x="-12" y="14" width="8" height="10" rx="2" fill="#815e4d"/><rect x="4" y="14" width="8" height="10" rx="2" fill="#815e4d"/></g><g transform="translate(783 255) scale(1)" opacity="0.3"><rect x="-15" y="-22" width="30" height="38" rx="6" fill="#edaa76"/><rect x="-12" y="-36" width="24" height="22" rx="5" fill="#f4c394"/><rect x="-6" y="-28" width="4" height="5" fill="#283b33"/><rect x="4" y="-28" width="4" height="5" fill="#283b33"/><rect x="-12" y="14" width="8" height="10" rx="2" fill="#815e4d"/><rect x="4" y="14" width="8" height="10" rx="2" fill="#815e4d"/></g><path d="M232 186 L437 186" stroke="#5d956c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="330" y="167" font-size="21" fill="#5d956c" font-weight="600" text-anchor="middle">direction = +1</text><path d="M729 226 L536 226" stroke="#5d956c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="645" y="207" font-size="21" fill="#5d956c" font-weight="600" text-anchor="middle">direction = −1</text><rect x="242" y="311" width="479" height="38" rx="8" fill="#ffffff" stroke="#cad8c4" stroke-width="2"/><text x="482" y="337" font-size="20" fill="#283b33" font-weight="600" text-anchor="middle">перемещение = speed × direction × dt</text><text x="34" y="370" font-size="17" fill="#64766a" font-weight="500" text-anchor="start">100 пикселей/с × 0,5 секунды = 50 пикселей. dt — время шага в секундах.</text></g></svg>